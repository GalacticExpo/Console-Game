<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24262c">
</head>
<body>
<title>Console Tycoon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Layout: landscape split. Left: a dark showroom with a spotlight, the status readout on
   top, the model in the middle and time controls at the bottom. Right: the workbench,
   a scrolling panel of console-plastic controls. Upright phones get a rotate prompt. */
:root {
  --plastic: #e4e1da;      /* workbench: light console plastic */
  --panel: #f4f2ed;
  --ink: #1e2025;
  --muted: #66645e;
  --line: #cbc6bb;
  --accent: #2c48c4;       /* cobalt "A button" */
  --accent-ink: #ffffff;
  --led: #c8372a;          /* power-LED red for danger */
  --good: #287048;
  --mid: #9a6a0a;
  /* The showroom stays dark in both themes, like a lit display case. */
  --room: #1a1b20;
  --room-light: #3a3d48;
  --room-fg: #ece9e1;
  --room-dim: #9d9a92;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --plastic: #16171b; --panel: #202228; --ink: #e8e5dd; --muted: #a09d95; --line: #353841;
    --accent: #7f95ff; --accent-ink: #0d1020; --led: #ff6b5d; --good: #5cc28a; --mid: #e0b04a;
    --room: #0c0d10; --room-light: #2a2d36; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --plastic: #16171b; --panel: #202228; --ink: #e8e5dd; --muted: #a09d95; --line: #353841;
  --accent: #7f95ff; --accent-ink: #0d1020; --led: #ff6b5d; --good: #5cc28a; --mid: #e0b04a;
  --room: #0c0d10; --room-light: #2a2d36; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; background: var(--plastic); }
body {
  color: var(--ink);
  font: 14px/1.45 var(--font-body);
  margin: 0;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 {
  font: 600 11px/1.2 var(--font-data); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 6px;
}
code { font-family: var(--font-data); font-size: 0.9em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- split layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
.stage {
  display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden;
  color: var(--room-fg);
  background: radial-gradient(ellipse 70% 60% at 50% 45%, var(--room-light), var(--room) 75%);
  padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: 12px;
}
.panel {
  min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px;
  padding-block: 12px 24px;
  padding-left: 14px;
  padding-right: max(14px, env(safe-area-inset-right, 0px));
}

/* ---------- status readout */
.lcd { display: flex; flex-direction: column; gap: 4px; }
.lcd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.logo {
  font: 14px/1.2 var(--font-display); background: none; border: 0; padding: 0; color: var(--room-fg);
  text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.date { font: 600 13px var(--font-data); white-space: nowrap; }
.lcd-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat b { font: 600 13px var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat small { font-size: 9px; color: var(--room-dim); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- showroom */
.showroom { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.model { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.model svg { width: 100%; height: 100%; max-height: 100%; }
.empty-model p { color: var(--room-dim); text-align: center; margin: 0; }
.caption { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; }
.caption b { font: 15px/1.2 var(--font-display); overflow-wrap: anywhere; }
.caption small { color: var(--room-dim); font-size: 12px; }
.focus-bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 360px; margin-top: 4px; }
.focus-bars span { display: flex; flex-direction: column; gap: 2px; }
.focus-bars i { display: block; height: 5px; border-radius: 3px; background: #7f95ff; min-width: 2px; }
.focus-bars small { font: 10px var(--font-data); color: var(--room-dim); text-transform: uppercase; }
.stage-title { text-align: center; }
.eyebrow { font: 600 11px var(--font-data); text-transform: uppercase; letter-spacing: 0.1em; color: #7f95ff; margin: 0; }
.big-title { font: clamp(22px, 4.2vw, 40px)/1 var(--font-display); }
.time { display: flex; flex-direction: column; gap: 6px; }
.skip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.skip .btn { min-height: 34px; padding-block: 4px; font: 600 12px var(--font-data); }
.next { width: 100%; min-height: 44px; font: 16px var(--font-display); }

/* ---------- workbench */
.lede { margin: 0; font-size: 15px; max-width: 34em; }
.screen-head { display: flex; align-items: center; gap: 10px; }
.screen-head h1 { font: 17px/1.2 var(--font-display); }
.back {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 11px; font: 600 12px var(--font-data); cursor: pointer; white-space: nowrap;
}
section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; gap: 8px; }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.empty p { margin: 0; }

/* ---------- rows */
.row {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px;
}
.card .row { background: none; border: 0; padding: 0; }
.row.tap { cursor: pointer; }
.card .row.on b { color: var(--accent); }
.row-main { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.row-main b { overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 12.5px; }
.num { font: 600 12.5px var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.swatch-dot { width: 14px; height: 14px; border-radius: 50%; flex: none; border: 1px solid var(--line); }
.score { font: 600 14px var(--font-data); border: 1px solid; border-radius: 8px; padding: 2px 8px; }
.score.good { color: var(--good); }
.score.mid { color: var(--mid); }
.score.bad { color: var(--led); }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ---------- news */
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.news li { display: grid; grid-template-columns: 60px 1fr; gap: 8px; font-size: 13px; }
.news time { font: 11px/1.8 var(--font-data); color: var(--muted); white-space: nowrap; }
.news span { min-width: 0; overflow-wrap: anywhere; }
.news li.note span { color: var(--muted); font-style: italic; }
.news li.note time { visibility: hidden; }
.news li.big span { font-weight: 600; }
.report { border-color: var(--accent); }
.report-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.report-head h2 { margin: 0; }
.delta { font: 600 16px var(--font-data); font-variant-numeric: tabular-nums; }
.delta.pos { color: var(--good); }
.delta.neg { color: var(--led); }

/* ---------- tiles & buttons */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-bottom-width: 3px;
  border-radius: var(--radius); padding: 10px 12px; cursor: pointer;
}
.tile small { color: var(--muted); font-size: 12px; }
.btn {
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 42px; padding: 7px 14px; border-radius: var(--radius); cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-bottom-width: 3px; font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: rgba(255, 255, 255, 0.06); color: var(--room-fg); border-color: rgba(255, 255, 255, 0.18); }
.btn.danger { color: var(--led); border-color: var(--led); }
.btn.quiet { background: none; border: 0; color: var(--muted); font-weight: 500; text-decoration: underline; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.wide { width: 100%; }
.btn-sub { font-weight: 400; font-size: 12px; opacity: 0.85; }
.split { display: flex; flex-wrap: wrap; gap: 8px; }
.split .btn { flex: 1 1 120px; }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; }
.tile:active, .btn:active, .opt:active, .chip:active, .swatch:active { transform: translateY(1px); }

/* ---------- forms */
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
legend {
  font: 600 11px var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  padding: 0; margin-bottom: 5px; width: 100%;
}
.legend-note, .label-note { float: right; text-transform: none; letter-spacing: 0; color: var(--accent); }
label { font: 600 11px var(--font-data); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
input, textarea {
  width: 100%; background: var(--plastic); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 11px; font-size: 16px; min-width: 0;
}
textarea { font: 12px/1.4 var(--font-data); resize: vertical; }
.opt {
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 10px;
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px 11px; cursor: pointer; width: 100%;
}
.opt b { grid-column: 1; }
.opt small { grid-column: 1; color: var(--muted); font-size: 12px; }
.opt .num { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.on b { color: var(--accent); }
.opt:disabled { opacity: 0.5; cursor: default; }
.opt.locked .num { color: var(--muted); font-weight: 400; text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
  font-size: 13.5px; cursor: pointer; min-height: 36px;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; background: var(--sw);
  border: 2px solid var(--line); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.2);
}
.swatch.on { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
.stepper {
  display: grid; grid-template-columns: 80px 38px 28px 38px 1fr; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px 10px;
}
.stepper span:first-child { font-weight: 600; font-size: 13.5px; }
.step {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); border-bottom-width: 3px;
  background: var(--plastic); font: 600 19px/1 var(--font-data); cursor: pointer;
}
.step:disabled { opacity: 0.35; }
.stepper output { text-align: center; font: 600 17px var(--font-data); }
.pips { color: var(--accent); letter-spacing: 1px; font-size: 11px; overflow: hidden; white-space: nowrap; }
.lessons { border-left: 3px solid var(--accent); padding-left: 10px; display: flex; flex-direction: column; gap: 4px; }
.lessons h3 { font: 600 11px var(--font-data); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.lessons p { margin: 0; font-size: 12.5px; }

/* ---------- data lists */
dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 0; }
dt { color: var(--muted); font-size: 12.5px; }
dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; overflow-wrap: anywhere; }
dd small { color: var(--muted); }
dd.neg { color: var(--led); }

/* ---------- games list */
.row.game { display: block; padding: 0; }
.row.game.on { border-color: var(--accent); }
.game-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; background: none; border: 0; text-align: left; cursor: pointer; }
.detail { padding: 0 11px 11px; font-size: 12.5px; color: var(--muted); }
.detail p { margin: 0 0 4px; }
.detail ul { margin: 4px 0 0; padding-left: 18px; }
.rules { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }

/* ---------- flash */
.flash { padding: 9px 11px; border-radius: var(--radius); font-weight: 500; border: 1px solid; background: var(--panel); }
.flash.ok { color: var(--good); border-color: var(--good); }
.flash.err { color: var(--led); border-color: var(--led); }

/* ---------- rotate prompt (upright phones) */
.rotate { display: none; }
@media (orientation: portrait) and (max-width: 700px) {
  :root:not(.upright) .rotate {
    display: flex; position: fixed; inset: 0; z-index: 20; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; text-align: center; background: var(--room); color: var(--room-fg);
    padding-block: 24px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
  .rotate svg { width: 96px; height: 96px; color: #7f95ff; animation: tilt 2.4s ease-in-out infinite; }
  .rotate h1 { font: 20px/1.2 var(--font-display); }
  .rotate p { margin: 0; max-width: 26em; color: var(--room-dim); }
  .rotate .btn { background: none; color: var(--room-fg); border-color: rgba(255, 255, 255, 0.25); }
  /* Played upright: showroom on top, workbench below. */
  :root.upright .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 46%) minmax(0, 1fr); }
}
@keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
