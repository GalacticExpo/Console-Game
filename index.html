<script>
// Console Tycoon game data. Edit freely, then run: node tools/build.js
"use strict";

(function (root) {
  // Each slot has tiers from cheapest to best. CPU, GPU and Memory tiers add
  // their rating to a console's power; Storage, Controller and Case add to its
  // appeal. Storage capacity limits how big a game the console can hold.
  const tiers = (names, costs, extra) => names.map((name, i) =>
    Object.assign({ name, rating: i + 1, unit_cost: costs[i] }, extra ? extra[i] : {}));

  const DATA = {
    START_YEAR: 1985,
    STARTING_MONEY: 150000,
    MONTH_NAMES: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],

    // Colours you can paint a console: [name, hex]. The first is the default.
    CONSOLE_COLORS: [["Charcoal", "#2b2d33"], ["Putty", "#d9d3c3"], ["Cobalt", "#2c48c4"], ["Cherry", "#c8372a"],
      ["Mint", "#7fc8a9"], ["Grape", "#6a4c9c"], ["Sunflower", "#e5b53a"]],

    POWER_SLOTS: ["CPU", "GPU", "Memory"],
    APPEAL_SLOTS: ["Storage", "Controller", "Case"],
    COMPONENTS: {
      CPU: tiers(["8-bit Pico", "16-bit Duo", "32-bit Tri", "64-bit Quad", "Multicore X", "Octa Fusion", "Neural Core"],
        [20, 28, 40, 55, 75, 100, 120]),
      GPU: tiers(["Tile Blitter", "Sprite Engine", "Polygon Pusher", "Texel Forge", "Shader Array", "Ray Weaver", "Photon Matrix"],
        [15, 22, 35, 50, 70, 95, 115]),
      Memory: tiers(["64 KB RAM", "512 KB RAM", "4 MB RAM", "32 MB RAM", "512 MB RAM", "8 GB RAM", "32 GB RAM"],
        [10, 13, 18, 25, 35, 45, 55]),
      Storage: tiers(["ROM Cartridge", "Mega Cartridge", "CD-ROM Drive", "DVD Drive", "Blu-ray Drive", "Solid State Drive", "Cloud Hybrid"],
        [8, 14, 20, 26, 35, 45, 50],
        [1, 2, 3, 3, 4, 4, 4].map((capacity) => ({ capacity }))),
      Controller: tiers(["Basic Pad", "Six-Button Pad", "Analog Stick Pad", "Rumble Pad", "Motion Wand", "Haptic Pad", "Neural Band"],
        [5, 7, 10, 12, 16, 18, 22]),
      Case: tiers(["Plastic Box", "Sleek Shell", "Translucent Shell", "Compact Slim", "Premium Alloy", "Designer Edition", "Morphing Shell"],
        [8, 9, 10, 12, 16, 20, 24]),
    },

    FOCUS_AREAS: ["Gameplay", "Graphics", "Story", "Audio"],
    FOCUS_POINTS: 10,
    // Hidden ideal focus split per genre (sums to FOCUS_POINTS).
    GENRES: {
      Action: { Gameplay: 4, Graphics: 3, Story: 1, Audio: 2 },
      Adventure: { Gameplay: 2, Graphics: 2, Story: 5, Audio: 1 },
      Platformer: { Gameplay: 5, Graphics: 3, Story: 1, Audio: 1 },
      Puzzle: { Gameplay: 6, Graphics: 1, Story: 1, Audio: 2 },
      Racing: { Gameplay: 4, Graphics: 4, Story: 0, Audio: 2 },
      Rhythm: { Gameplay: 4, Graphics: 1, Story: 0, Audio: 5 },
      RPG: { Gameplay: 3, Graphics: 2, Story: 4, Audio: 1 },
      Shooter: { Gameplay: 4, Graphics: 4, Story: 1, Audio: 1 },
      Simulation: { Gameplay: 5, Graphics: 2, Story: 1, Audio: 2 },
      Sports: { Gameplay: 4, Graphics: 3, Story: 0, Audio: 3 },
      Strategy: { Gameplay: 5, Graphics: 1, Story: 3, Audio: 1 },
    },
    // Topic: [genres that fit well, genres that clash]
    TOPICS: {
      Aliens: [["Shooter", "Strategy", "Adventure"], ["Sports"]],
      Animals: [["Platformer", "Simulation"], ["Shooter"]],
      Cars: [["Racing", "Simulation"], ["RPG", "Adventure"]],
      Cooking: [["Simulation", "Puzzle"], ["Shooter"]],
      Cyberpunk: [["RPG", "Shooter", "Adventure"], ["Sports"]],
      Detective: [["Adventure", "Puzzle"], ["Racing", "Sports"]],
      Dinosaurs: [["Action", "Adventure"], ["Puzzle"]],
      Fantasy: [["RPG", "Adventure", "Strategy"], ["Racing", "Sports"]],
      Farming: [["Simulation", "Strategy"], ["Shooter", "Racing"]],
      Horror: [["Adventure", "Shooter"], ["Sports", "Rhythm"]],
      Medieval: [["Strategy", "RPG", "Action"], ["Racing", "Rhythm"]],
      Music: [["Rhythm", "Simulation"], ["Shooter", "Strategy"]],
      Mythology: [["RPG", "Action", "Strategy"], ["Racing"]],
      Ninjas: [["Action", "Platformer"], ["Simulation"]],
      Pirates: [["Adventure", "Action", "Strategy"], ["Racing"]],
      Robots: [["Action", "Shooter", "Strategy"], ["Rhythm"]],
      Soccer: [["Sports", "Simulation"], ["RPG", "Adventure", "Shooter"]],
      Space: [["Shooter", "Strategy", "Simulation"], ["Sports", "Rhythm"]],
      Spies: [["Action", "Adventure"], ["Rhythm"]],
      Zombies: [["Shooter", "Action"], ["Puzzle", "Sports"]],
    },
    // months: dev time, cost: paid up front, capacity: storage needed,
    // price: retail price, reach: sales multiplier, polish: review multiplier
    GAME_SIZES: {
      Small: { months: 2, cost: 10000, capacity: 1, price: 20, reach: 0.6, polish: 0.95 },
      Medium: { months: 4, cost: 50000, capacity: 2, price: 35, reach: 1.0, polish: 1.0 },
      Large: { months: 7, cost: 250000, capacity: 3, price: 50, reach: 1.6, polish: 1.03 },
      AAA: { months: 11, cost: 1200000, capacity: 4, price: 60, reach: 2.4, polish: 1.06 },
    },
  };

  if (typeof module !== "undefined" && module.exports) module.exports = DATA;
  else root.CT_DATA = DATA;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Console Tycoon simulation: design consoles, make games for them, watch them sell.
"use strict";

(function (root) {
  const D = root.CT_DATA || (typeof require !== "undefined" ? require("./data.js") : null);

  const RETAIL_SHARE = 0.75;      // share of a console's price you keep after retailers
  const GAME_SHARE = 0.70;        // share of a game's price you keep
  const CONSOLE_DEMAND = 600;     // base console buyers per month
  const SLOTS = [...D.POWER_SLOTS, ...D.APPEAL_SLOTS];
  const SIZE_NAMES = Object.keys(D.GAME_SIZES);

  class GameError extends Error {}

  // ------------------------------------------------------------ random
  class Rng {
    constructor(seed) { this.seed(seed); }
    seed(n) { this.a = (Math.floor(n) ^ 0x9e3779b9) >>> 0; for (let i = 0; i < 4; i++) this.random(); }
    random() { // mulberry32
      let t = (this.a = (this.a + 0x6d2b79f5) >>> 0);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    uniform(a, b) { return a + (b - a) * this.random(); }
    gauss(mu, sigma) {
      const u = 1 - this.random(), v = this.random();
      return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
  }

  // ------------------------------------------------------------ console stats
  const part = (c, slot) => D.COMPONENTS[slot][c.parts[slot]];
  const power = (c) => D.POWER_SLOTS.reduce((t, s) => t + part(c, s).rating, 0);
  const appeal = (c) => D.APPEAL_SLOTS.reduce((t, s) => t + part(c, s).rating, 0);
  const capacity = (c) => part(c, "Storage").capacity;
  const unitCost = (c) => SLOTS.reduce((t, s) => t + part(c, s).unit_cost, 0);
  const fairPrice = (c) => Math.round(80 + 15 * (power(c) + appeal(c)));
  const devCost = (parts) => 15000 + 1000 * SLOTS.reduce((t, s) => t + D.COMPONENTS[s][parts[s]].unit_cost, 0);
  const devMonths = (parts) => 3 + Math.floor(Math.max(...Object.values(parts)) / 2);
  const biggestSize = (cap) => SIZE_NAMES.filter((k) => D.GAME_SIZES[k].capacity <= cap).pop();
  const withArticle = (w) => (/^[AEIOU]/.test(w) ? `an ${w}` : `a ${w}`);

  function newConsole(f) {
    return Object.assign({ name: "", parts: {}, price: 0, color: D.CONSOLE_COLORS[0][1], status: "dev", dev_months_left: 0,
      launch_month: -1, installed_base: 0, revenue: 0, profit: 0, last_sales: 0 }, f);
  }
  function newGame(f) {
    return Object.assign({ title: "", genre: "", topic: "", size: "", platform: "", focus: {},
      status: "dev", months_left: 0, release_month: -1, score: 0, reviews: [], feedback: [],
      units_sold: 0, revenue: 0, last_sales: 0 }, f);
  }

  const FIELDS = ["version", "company", "seed", "money", "month", "unlocked", "consoles", "games", "news"];

  class State {
    constructor(f) {
      Object.assign(this, { version: 2, company: "", seed: 1, money: D.STARTING_MONEY, month: 0,
        // Best tier unlocked in each part slot. Everything starts at the earliest type.
        unlocked: Object.fromEntries(SLOTS.map((s) => [s, 0])),
        consoles: [], games: [], news: [] }, f || {});
      this.consoles = this.consoles.map(newConsole);
      this.games = this.games.map(newGame);
      this.rng = new Rng(this.seed * 1000 + this.month);
    }

    get date() { return `${D.MONTH_NAMES[this.month % 12]} ${D.START_YEAR + Math.floor(this.month / 12)}`; }
    say(text) { this.news.push(`[${this.date}] ${text}`); }

    console(name) {
      const c = this.consoles.find((x) => x.name === name);
      if (!c) throw new GameError(`No console named "${name}".`);
      return c;
    }
    consoleInDev() { return this.consoles.find((c) => c.status === "dev") || null; }
    gameInDev() { return this.games.find((g) => g.status === "dev") || null; }
    platforms() { return this.consoles.filter((c) => c.status !== "retired" || c.installed_base > 0); }
    nameTaken(name) {
      const n = name.toLowerCase();
      return this.consoles.some((c) => c.name.toLowerCase() === n) || this.games.some((g) => g.title.toLowerCase() === n);
    }
    spend(amount) {
      if (amount > this.money) throw new GameError(`Not enough money: need ${fmtMoney(amount)}, have ${fmtMoney(this.money)}.`);
      this.money -= amount;
    }

    // ---------------------------------------------------------- consoles
    designConsole(name, parts, price, color) {
      name = (name || "").trim();
      if (!name) throw new GameError("Your console needs a name.");
      if (this.nameTaken(name)) throw new GameError(`The name "${name}" is already in use.`);
      for (const s of SLOTS) {
        if (!(parts[s] >= 0 && parts[s] < D.COMPONENTS[s].length)) throw new GameError(`Pick a ${s}.`);
        if (parts[s] > this.unlocked[s]) throw new GameError(`The ${D.COMPONENTS[s][parts[s]].name} is locked.`);
      }
      if (!(price > 0)) throw new GameError("Price must be more than $0.");
      if (this.consoleInDev()) throw new GameError("Your hardware team is already building a console.");
      const cost = devCost(parts);
      this.spend(cost);
      if (!D.CONSOLE_COLORS.some(([, hex]) => hex === color)) color = D.CONSOLE_COLORS[0][1];
      const c = newConsole({ name, parts: { ...parts }, price: Math.round(price), color, dev_months_left: devMonths(parts) });
      this.consoles.push(c);
      this.say(`Hardware team began building the ${name} (${fmtMoney(cost)}).`);
      return c;
    }
    setPrice(name, price) {
      if (!(price > 0)) throw new GameError("Price must be more than $0.");
      this.console(name).price = Math.round(price);
    }
    discontinue(name) {
      const c = this.console(name);
      if (c.status !== "active") throw new GameError("Only consoles on sale can be discontinued.");
      c.status = "retired";
      this.say(`${c.name} discontinued after selling ${fmtNum(c.installed_base)} units.`);
    }

    // ---------------------------------------------------------- games
    startGame(title, genre, topic, size, platform, focus) {
      title = (title || "").trim();
      if (!title) throw new GameError("Your game needs a title.");
      if (this.nameTaken(title)) throw new GameError(`The name "${title}" is already in use.`);
      if (!(genre in D.GENRES) || !(topic in D.TOPICS) || !(size in D.GAME_SIZES)) throw new GameError("Pick a genre, topic and size.");
      const vals = D.FOCUS_AREAS.map((a) => focus[a]);
      if (vals.some((v) => !Number.isInteger(v) || v < 0) || vals.reduce((a, b) => a + b, 0) !== D.FOCUS_POINTS) {
        throw new GameError(`Use exactly ${D.FOCUS_POINTS} focus points.`);
      }
      const plat = this.console(platform);
      if (!this.platforms().includes(plat)) throw new GameError(`You can't make games for the ${plat.name}.`);
      if (capacity(plat) < D.GAME_SIZES[size].capacity) throw new GameError(`A ${size} game won't fit on the ${plat.name}'s ${part(plat, "Storage").name}.`);
      if (this.gameInDev()) throw new GameError("Your studio is already making a game.");
      this.spend(D.GAME_SIZES[size].cost);
      const g = newGame({ title, genre, topic, size, platform: plat.name, focus: { ...focus }, months_left: D.GAME_SIZES[size].months });
      this.games.push(g);
      this.say(`Started work on ${title} (${size} ${topic} ${genre}) for the ${plat.name}.`);
      return g;
    }

    comboRating(genre, topic) {
      const [good, bad] = D.TOPICS[topic];
      return good.includes(genre) ? "great" : bad.includes(genre) ? "poor" : "okay";
    }
    focusMatch(genre, focus) {
      const ideal = D.GENRES[genre];
      return 1 - D.FOCUS_AREAS.reduce((t, a) => t + Math.abs(focus[a] - ideal[a]), 0) / (2 * D.FOCUS_POINTS);
    }
    // How much the console's power lifts or limits a game's graphics.
    graphicsFactor(plat) { return Math.min(1.4, Math.max(0.6, power(plat) / 12)); }

    reviewGame(g) {
      const plat = this.console(g.platform);
      let q = 2.3 + 6.5 * this.focusMatch(g.genre, g.focus) ** 1.5;
      q *= { great: 1.12, okay: 1.0, poor: 0.75 }[this.comboRating(g.genre, g.topic)];
      const gf = this.graphicsFactor(plat);
      q *= gf ** (0.05 * g.focus.Graphics);
      q *= D.GAME_SIZES[g.size].polish;
      const prev = this.games.filter((x) => x.status === "released").sort((a, b) => b.release_month - a.release_month)[0];
      if (prev && prev.genre === g.genre && prev.topic === g.topic) q *= 0.85;
      q += this.rng.gauss(0, 0.5);
      g.reviews = [0, 1, 2, 3].map(() => Math.min(10, Math.max(1, Math.round(q + this.rng.gauss(0, 0.6)))));
      g.score = g.reviews.reduce((a, b) => a + b, 0) / 4;
      g.feedback = this.critique(g, gf, prev);
    }

    critique(g, gf, prev) {
      const notes = [];
      const ideal = D.GENRES[g.genre];
      const diffs = Object.fromEntries(D.FOCUS_AREAS.map((a) => [a, g.focus[a] - ideal[a]]));
      const worst = D.FOCUS_AREAS.reduce((a, b) => (Math.abs(diffs[b]) > Math.abs(diffs[a]) ? b : a));
      if (Object.values(diffs).every((d) => Math.abs(d) <= 1)) notes.push(`Critics felt the focus was just right for ${withArticle(g.genre)} game.`);
      else if (diffs[worst] < 0) notes.push(`Critics wanted more ${worst} from ${withArticle(g.genre)} game.`);
      else notes.push(`Critics thought too much effort went into ${worst} for ${withArticle(g.genre)} game.`);
      const rating = this.comboRating(g.genre, g.topic);
      if (rating === "great") notes.push(`${g.topic} and ${g.genre} are a fantastic match!`);
      else if (rating === "poor") notes.push(`Players found ${g.topic} a strange theme for ${withArticle(g.genre)} game.`);
      if (gf < 0.8 && g.focus.Graphics >= 3) notes.push(`The ${g.platform}'s weak hardware held the graphics back.`);
      else if (gf > 1.2 && g.focus.Graphics >= 3) notes.push(`The ${g.platform}'s power made the graphics shine.`);
      if (prev && prev.genre === g.genre && prev.topic === g.topic) notes.push("Players felt they had played this before.");
      return notes;
    }

    // ---------------------------------------------------------- sales
    libraryFactor(c) {
      const hits = this.games.filter((g) => g.status === "released" && g.platform === c.name && this.month - g.release_month <= 36)
        .reduce((t, g) => t + 2 ** (g.score - 6) * D.GAME_SIZES[g.size].reach, 0);
      return 0.6 + Math.min(2.0, hits / 6);
    }
    consoleDemand(c) {
      const age = this.month - c.launch_month;
      const quality = ((power(c) + appeal(c)) / 12) ** 0.8;
      const priceFactor = Math.min(4, Math.max(0.05, (fairPrice(c) / c.price) ** 2));
      const hype = age < 3 ? 1.4 : 1;
      return CONSOLE_DEMAND * quality * priceFactor * this.libraryFactor(c) * hype * 0.975 ** age;
    }

    // ---------------------------------------------------------- the clock
    advance() {
      const start = this.news.length;
      this.month += 1;
      this.rng.seed(this.seed * 1000 + this.month);
      const before = this.money;

      for (const c of this.consoles) {
        if (c.status === "dev" && --c.dev_months_left <= 0) {
          c.status = "active";
          c.launch_month = this.month;
          this.say(`The ${c.name} is in stores! Launch price $${c.price}.`);
        }
      }
      for (const g of this.games) {
        if (g.status !== "dev" || --g.months_left > 0) continue;
        const plat = this.console(g.platform);
        if (plat.status === "dev") { g.months_left = 1; continue; } // ships with the console
        this.reviewGame(g);
        g.status = "released";
        g.release_month = this.month;
        this.say(`${g.title} released on the ${plat.name}! Reviews: ${g.reviews.join(" / ")} (avg ${g.score.toFixed(1)})`);
        for (const n of g.feedback) this.say(`  - ${n}`);
      }

      for (const c of this.consoles) {
        c.last_sales = 0;
        if (c.status !== "active") continue;
        const units = Math.trunc(this.consoleDemand(c) * this.rng.uniform(0.9, 1.1));
        const rev = Math.trunc(units * c.price * RETAIL_SHARE);
        const profit = rev - units * unitCost(c);
        c.last_sales = units;
        c.installed_base += units;
        c.revenue += rev;
        c.profit += profit;
        this.money += profit;
      }

      for (const g of this.games) {
        g.last_sales = 0;
        if (g.status !== "released") continue;
        const age = this.month - g.release_month;
        const plat = this.console(g.platform);
        let copies = plat.installed_base * 0.02 * 2 ** (g.score - 6) * D.GAME_SIZES[g.size].reach * 0.8 ** age;
        if (plat.status === "retired") copies *= 0.5;
        copies = Math.min(Math.trunc(copies), plat.installed_base);
        if (copies < 20 || age > 36) continue;
        const rev = Math.trunc(copies * D.GAME_SIZES[g.size].price * GAME_SHARE);
        g.last_sales = copies;
        g.units_sold += copies;
        g.revenue += rev;
        this.money += rev;
      }

      const fresh = this.news.slice(start);
      this.news = this.news.slice(-100);
      return { lines: fresh, delta: this.money - before };
    }

    toDict() { return Object.fromEntries(FIELDS.map((f) => [f, this[f]])); }
    toJSON() { return this.toDict(); }
    static fromDict(d) {
      if (!d || d.version !== 2) throw new GameError("That save is from a different version of the game.");
      return new State(d);
    }
  }

  function createGame(company, seed) {
    const s = new State({ company, seed: seed === undefined ? 1 + Math.floor(Math.random() * 999999) : seed });
    s.say(`${company} opens its doors in a garage. Design a console, then make games for it!`);
    return s;
  }

  function fmtMoney(n) {
    const sign = n < 0 ? "-" : "", a = Math.abs(n);
    if (a >= 1e9) return `${sign}$${(a / 1e9).toFixed(2)}B`;
    if (a >= 1e6) return `${sign}$${(a / 1e6).toFixed(2)}M`;
    if (a >= 10000) return `${sign}$${Math.round(a / 1000)}K`;
    return `${sign}$${Math.round(a).toLocaleString("en-US")}`;
  }
  function fmtNum(n) {
    if (n >= 1e6) return `${(n / 1e6).toFixed(2)}M`;
    if (n >= 10000) return `${Math.round(n / 1000)}K`;
    return Math.trunc(n).toLocaleString("en-US");
  }

  const api = { D, State, GameError, createGame, fmtMoney, fmtNum, part, power, appeal, capacity, unitCost,
    fairPrice, devCost, devMonths, biggestSize, SLOTS, SIZE_NAMES, RETAIL_SHARE, GAME_SHARE };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.CT = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Draws the showroom models: consoles built from their parts, and game cartridges / boxes.
// Every function returns an SVG string.
"use strict";

(function (root) {
  const D = root.CT_DATA;
  let uid = 0;

  // ------------------------------------------------------------ colour helpers
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function shade(hex, amt) { // amt -1..1: darker..lighter
    const [r, g, b] = hexToRgb(hex);
    const f = (c) => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
    return `rgb(${f(r)},${f(g)},${f(b)})`;
  }
  const isLight = (hex) => { const [r, g, b] = hexToRgb(hex); return r * 0.299 + g * 0.587 + b * 0.114 > 150; };
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function seeded(seed) {
    let a = seed || 1;
    return () => { a = (a + 0x6d2b79f5) >>> 0; let t = Math.imul(a ^ (a >>> 15), a | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // ------------------------------------------------------------ console
  // Case tiers: front-face height, corner radius and finish.
  const CASES = [
    { h: 92, rx: 5, ridges: true },                // Plastic Box
    { h: 84, rx: 26 },                             // Sleek Shell
    { h: 90, rx: 12, clear: true },                // Translucent Shell
    { h: 58, rx: 10 },                             // Compact Slim
    { h: 78, rx: 14, metal: true },                // Premium Alloy
    { h: 92, rx: 3, slant: true },                 // Designer Edition
    { h: 86, rx: 43, glow: true },                 // Morphing Shell
  ];

  function consoleSVG({ parts, color, name }) {
    const id = `m${++uid}`;
    const cs = CASES[parts.Case] || CASES[0];
    const W = 250, x0 = 70, base = 206, top = base - cs.h, dx = 26, dy = -18;
    const body = color || "#2b2d33";
    const ink = isLight(body) ? "#24262c" : "#f1eee6";
    const power = ["CPU", "GPU", "Memory"].reduce((t, s) => t + parts[s] + 1, 0);
    const flat = cs.rx > 16;
    const out = [];

    out.push(`<defs>
      <linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${shade(body, cs.metal ? 0.35 : 0.08)}"/>
        <stop offset="1" stop-color="${shade(body, cs.metal ? -0.35 : -0.12)}"/>
      </linearGradient>
      <radialGradient id="${id}g" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7fd7ff" stop-opacity="0.8"/><stop offset="1" stop-color="#7fd7ff" stop-opacity="0"/></radialGradient>
    </defs>`);
    out.push(`<ellipse cx="${x0 + W / 2 + 12}" cy="${base + 10}" rx="${W / 2 + 40}" ry="14" fill="#000" opacity="0.35"/>`);
    if (cs.glow) out.push(`<ellipse cx="${x0 + W / 2}" cy="${top + cs.h / 2}" rx="${W / 2 + 30}" ry="${cs.h}" fill="url(#${id}g)" opacity="0.5"/>`);

    // Side and top faces give a little depth to boxy cases.
    if (!flat) {
      out.push(`<polygon points="${x0 + W},${top} ${x0 + W + dx},${top + dy} ${x0 + W + dx},${base + dy} ${x0 + W},${base}" fill="${shade(body, -0.35)}"/>`);
      out.push(`<polygon points="${x0},${top} ${x0 + W},${top} ${x0 + W + dx},${top + dy} ${x0 + dx},${top + dy}" fill="${shade(body, 0.22)}"/>`);
      if (cs.ridges) {
        for (let i = 1; i <= 5; i++) {
          const x = x0 + W * 0.62 + i * 14;
          out.push(`<line x1="${x}" y1="${top - 1}" x2="${x + dx}" y2="${top + dy - 1}" stroke="${shade(body, -0.2)}" stroke-width="3"/>`);
        }
      }
    }

    // Storage on top (cartridge slots, CD lid) is drawn before the front face.
    const st = parts.Storage;
    const sx = x0 + W * 0.36, sy = top + (flat ? 6 : dy / 2);
    if (st <= 1) {
      const cw = st === 0 ? 74 : 92, ch = st === 0 ? 58 : 64;
      out.push(`<rect x="${sx - 6}" y="${sy - 4}" width="${cw + 12}" height="9" rx="3" fill="#111"/>`);
      out.push(`<rect x="${sx}" y="${sy - ch}" width="${cw}" height="${ch + 2}" rx="5" fill="#8d8f96"/>`);
      for (let i = 0; i < 4; i++) out.push(`<rect x="${sx + 8}" y="${sy - ch + 6 + i * 5}" width="${cw - 16}" height="2" fill="#6f7178"/>`);
      out.push(`<rect x="${sx + 8}" y="${sy - ch + 28}" width="${cw - 16}" height="${ch - 34}" rx="2" fill="${st === 0 ? "#e9e4d4" : "#f2c14e"}"/>`);
      out.push(`<rect x="${sx + 14}" y="${sy - ch + 34}" width="${cw - 28}" height="5" fill="${st === 0 ? "#c8372a" : "#2c48c4"}"/>`);
    } else if (st === 2) {
      out.push(`<ellipse cx="${sx + 40}" cy="${sy}" rx="${flat ? 48 : 52}" ry="${flat ? 7 : 11}" fill="${shade(body, -0.25)}" stroke="${shade(body, 0.3)}" stroke-width="2"/>`);
      out.push(`<ellipse cx="${sx + 40}" cy="${sy}" rx="10" ry="2.5" fill="${shade(body, 0.4)}"/>`);
    } else if (st === 6) {
      for (let i = 1; i <= 3; i++) out.push(`<path d="M ${sx + 40 - i * 14} ${sy - 10 - i * 4} q ${i * 14} ${-i * 12} ${i * 28} 0" fill="none" stroke="#7fd7ff" stroke-width="3" stroke-linecap="round" opacity="${1 - i * 0.2}"/>`);
    }

    // Front face.
    if (cs.slant) {
      out.push(`<polygon points="${x0 + 18},${top} ${x0 + W},${top} ${x0 + W - 10},${base} ${x0},${base}" fill="url(#${id}f)"/>`);
      out.push(`<polygon points="${x0 + 18},${top} ${x0 + W},${top} ${x0 + W + dx},${top + dy} ${x0 + 18 + dx},${top + dy}" fill="${shade(body, 0.22)}"/>`);
    } else {
      out.push(`<rect x="${x0}" y="${top}" width="${W}" height="${cs.h}" rx="${cs.rx}" fill="url(#${id}f)" ${cs.clear ? 'fill-opacity="0.72"' : ""}/>`);
    }
    if (cs.clear) {
      out.push(`<rect x="${x0 + 100}" y="${top + 22}" width="64" height="38" rx="3" fill="#2f7a4a" opacity="0.45"/>`);
      for (let i = 0; i < 6; i++) out.push(`<rect x="${x0 + 106 + i * 10}" y="${top + 30}" width="6" height="22" fill="#1e2025" opacity="0.4"/>`);
    }
    if (cs.metal) out.push(`<rect x="${x0 + 10}" y="${top + 6}" width="${W - 20}" height="3" rx="1.5" fill="#fff" opacity="0.35"/>`);

    // Front details: drive slots, vents (one per point of power), LED, name badge.
    if (st === 3 || st === 4) {
      out.push(`<rect x="${x0 + 22}" y="${top + 12}" width="96" height="7" rx="3.5" fill="#111"/>`);
      if (st === 4) out.push(`<rect x="${x0 + 26}" y="${top + 21}" width="88" height="2" fill="#4f7cff"/>`);
    } else if (st === 5) {
      out.push(`<rect x="${x0 + 22}" y="${top + 13}" width="96" height="3" rx="1.5" fill="#7fd7ff" opacity="0.9"/>`);
    }
    const vents = Math.min(power, 8);
    for (let i = 0; i < vents; i++) {
      const vx = x0 + W - 24 - i * 7;
      out.push(`<rect x="${vx}" y="${top + cs.h * 0.3}" width="3" height="${cs.h * 0.45}" rx="1.5" fill="${shade(body, -0.45)}"/>`);
    }
    out.push(`<circle cx="${x0 + 22}" cy="${base - 18}" r="4.5" fill="#ff5a4a"/><circle cx="${x0 + 22}" cy="${base - 18}" r="9" fill="#ff5a4a" opacity="0.25"/>`);
    out.push(`<rect x="${x0 + 36}" y="${base - 24}" width="26" height="12" rx="3" fill="${shade(body, -0.3)}"/>`);
    const label = esc((name || "").slice(0, 16).toUpperCase());
    if (label) out.push(`<text x="${x0 + 22}" y="${top + (cs.h < 70 ? 31 : cs.h * 0.5)}" font-family="Silkscreen, 'Courier New', monospace" font-size="${cs.h < 70 ? 12 : 15}" fill="${ink}" opacity="0.9">${label}</text>`);

    out.push(controllerSVG(parts.Controller, body, x0, base));
    return `<svg viewBox="0 0 420 290" role="img" aria-label="Model of ${esc(name || "your console")}" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
  }

  function controllerSVG(tier, body, x0, base) {
    const cx = 150, cy = 252;
    const pad = shade(body, -0.15), edge = shade(body, 0.25);
    const out = [];
    if (tier <= 3) out.push(`<path d="M ${cx + 40} ${cy - 14} C ${cx + 70} ${cy - 40}, ${x0 + 130} ${base + 20}, ${x0 + 120} ${base - 4}" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/>`);
    if (tier === 4) { // motion wand
      out.push(`<rect x="${cx - 70}" y="${cy - 9}" width="150" height="20" rx="10" fill="${pad}" stroke="${edge}" stroke-width="2" transform="rotate(-12 ${cx} ${cy})"/>`);
      out.push(`<circle cx="${cx - 52}" cy="${cy + 13}" r="6" fill="#7fd7ff" opacity="0.9"/><circle cx="${cx + 30}" cy="${cy - 6}" r="5" fill="#c8372a"/>`);
      return out.join("");
    }
    if (tier === 6) { // neural band
      out.push(`<ellipse cx="${cx}" cy="${cy}" rx="62" ry="18" fill="none" stroke="${pad}" stroke-width="10"/>`);
      out.push(`<ellipse cx="${cx}" cy="${cy}" rx="62" ry="18" fill="none" stroke="#7fd7ff" stroke-width="2" opacity="0.8"/>`);
      return out.join("");
    }
    const w = tier >= 2 ? 140 : 118, h = tier >= 2 ? 52 : 40;
    out.push(`<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${pad}" stroke="${edge}" stroke-width="2"/>`);
    // d-pad
    const dx = cx - w / 2 + 26, dy = cy - (tier >= 2 ? 6 : 0);
    out.push(`<rect x="${dx - 10}" y="${dy - 3.5}" width="20" height="7" rx="1.5" fill="#1b1c20"/><rect x="${dx - 3.5}" y="${dy - 10}" width="7" height="20" rx="1.5" fill="#1b1c20"/>`);
    // face buttons
    const bx = cx + w / 2 - 28, by = dy;
    const buttons = tier === 0 ? [[-8, 4], [8, -4]]
      : tier === 1 ? [[-12, 5], [0, 5], [12, 5], [-12, -7], [0, -7], [12, -7]]
        : [[0, -10], [-10, 0], [10, 0], [0, 10]];
    const colors = ["#c8372a", "#2c48c4", "#e0b04a", "#287048", "#c8372a", "#2c48c4"];
    buttons.forEach(([ox, oy], i) => out.push(`<circle cx="${bx + ox}" cy="${by + oy}" r="${tier === 1 ? 4.5 : 5.5}" fill="${tier === 0 ? "#c8372a" : colors[i]}"/>`));
    if (tier >= 2) { // analog sticks
      out.push(`<circle cx="${cx - 18}" cy="${cy + 12}" r="8" fill="#1b1c20"/><circle cx="${cx + 18}" cy="${cy + 12}" r="8" fill="#1b1c20"/>`);
    }
    if (tier === 3) { // rumble
      out.push(`<path d="M ${cx - w / 2 - 12} ${cy - 10} l -6 5 l 6 5 l -6 5" fill="none" stroke="${edge}" stroke-width="2"/><path d="M ${cx + w / 2 + 12} ${cy - 10} l 6 5 l -6 5 l 6 5" fill="none" stroke="${edge}" stroke-width="2"/>`);
    }
    if (tier === 5) out.push(`<rect x="${cx - 16}" y="${cy - 20}" width="32" height="16" rx="4" fill="#7fd7ff" opacity="0.55"/>`);
    else if (tier < 2) out.push(`<rect x="${cx - 12}" y="${cy - 2}" width="10" height="4" rx="2" fill="#1b1c20"/><rect x="${cx + 4}" y="${cy - 2}" width="10" height="4" rx="2" fill="#1b1c20"/>`);
    return out.join("");
  }

  // ------------------------------------------------------------ game
  const GENRE_HUES = { Action: 8, Adventure: 140, Platformer: 48, Puzzle: 280, Racing: 200, Rhythm: 320, RPG: 260, Shooter: 0, Simulation: 170, Sports: 110, Strategy: 30 };

  function wrap(text, max) {
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let line = "";
    for (const w of words) {
      if ((line + " " + w).trim().length > max && line) { lines.push(line); line = w; } else line = (line + " " + w).trim();
    }
    if (line) lines.push(line);
    return lines.slice(0, 3).map((l) => (l.length > max ? l.slice(0, max - 1) + "…" : l));
  }

  // Cover art: shapes seeded by the title, coloured by the genre.
  function coverArt(id, x, y, w, h, g) {
    const hue = g.genre ? GENRE_HUES[g.genre] : 220;
    const sat = g.genre ? 62 : 8;
    const rnd = seeded(hash(`${g.title}|${g.topic}|${g.genre}`));
    const out = [`<defs><linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="hsl(${hue},${sat}%,52%)"/><stop offset="1" stop-color="hsl(${(hue + 40) % 360},${sat + 8}%,22%)"/></linearGradient>
        <clipPath id="${id}c"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/></clipPath></defs>`,
    `<g clip-path="url(#${id}c)"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${id}a)"/>`];
    if (g.genre) {
      for (let i = 0; i < 7; i++) {
        const px = x + rnd() * w, py = y + rnd() * h, r = 10 + rnd() * w * 0.28;
        const fill = `hsla(${(hue + rnd() * 80 - 40 + 360) % 360},80%,${55 + rnd() * 30}%,${0.18 + rnd() * 0.3})`;
        const kind = Math.floor(rnd() * 3);
        if (kind === 0) out.push(`<circle cx="${px}" cy="${py}" r="${r}" fill="${fill}"/>`);
        else if (kind === 1) out.push(`<polygon points="${px},${py - r} ${px + r},${py + r * 0.8} ${px - r},${py + r * 0.8}" fill="${fill}"/>`);
        else out.push(`<rect x="${px - r}" y="${py - r / 4}" width="${r * 2}" height="${r / 2}" fill="${fill}" transform="rotate(${rnd() * 60 - 30} ${px} ${py})"/>`);
      }
    }
    if (g.topic) out.push(`<text x="${x + 10}" y="${y + 24}" font-family="Silkscreen, 'Courier New', monospace" font-size="17" fill="#fff" opacity="0.92">${esc(g.topic.toUpperCase())}</text>`);
    const lines = wrap(g.title || "Untitled", 13);
    const bandH = 20 + lines.length * 18;
    out.push(`<rect x="${x}" y="${y + h - bandH}" width="${w}" height="${bandH}" fill="#000" opacity="0.55"/>`);
    lines.forEach((l, i) => out.push(`<text x="${x + 10}" y="${y + h - bandH + 24 + i * 18}" font-family="'IBM Plex Sans', system-ui, sans-serif" font-weight="700" font-size="17" fill="#fff">${esc(l)}</text>`));
    if (g.size) out.push(`<rect x="${x + w - 52}" y="${y + 8}" width="44" height="16" rx="3" fill="#fff" opacity="0.9"/><text x="${x + w - 30}" y="${y + 20}" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="10" fill="#1e2025">${esc(g.size.toUpperCase())}</text>`);
    out.push(`</g>`);
    return out.join("");
  }

  // g: {title, genre, topic, size}; cart: true for cartridge consoles, false for discs.
  function gameSVG(g, cart) {
    const id = `g${++uid}`;
    const out = [`<ellipse cx="210" cy="272" rx="120" ry="10" fill="#000" opacity="0.35"/>`];
    if (cart) {
      out.push(`<path d="M 120 30 h 180 a 8 8 0 0 1 8 8 v 214 a 8 8 0 0 1 -8 8 h -150 l -22 -18 h -8 a 8 8 0 0 1 -8 -8 v -196 a 8 8 0 0 1 8 -8 z" fill="#8d8f96"/>`);
      for (let i = 0; i < 4; i++) out.push(`<rect x="132" y="${40 + i * 7}" width="156" height="3" rx="1.5" fill="#6f7178"/>`);
      out.push(`<rect x="130" y="70" width="160" height="168" rx="4" fill="#e9e4d4"/>`);
      out.push(coverArt(id, 136, 76, 148, 156, g));
    } else {
      out.push(`<rect x="100" y="20" width="220" height="246" rx="6" fill="#1b1c20"/><rect x="100" y="20" width="16" height="246" rx="3" fill="#33353c"/>`);
      out.push(coverArt(id, 120, 26, 194, 234, g));
    }
    return `<svg viewBox="0 0 420 290" role="img" aria-label="Box art for ${esc(g.title || "your game")}" xmlns="http://www.w3.org/2000/svg">${out.join("")}</svg>`;
  }

  root.CT_MODELS = { consoleSVG, gameSVG };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Console Tycoon touch UI. Landscape layout: the left "showroom" shows a model of the
// console or game being worked on; the right panel holds the controls for making it.
"use strict";

(function () {
  const { D, State, GameError, createGame, fmtMoney, fmtNum, part, power, appeal, capacity, unitCost,
    fairPrice, devCost, devMonths, biggestSize, SLOTS, SIZE_NAMES, RETAIL_SHARE } = window.CT;
  const { consoleSVG, gameSVG } = window.CT_MODELS;

  const SAVE_KEY = "console-tycoon-save-v2";
  const UPRIGHT_KEY = "console-tycoon-upright";
  const app = document.getElementById("app");

  let s = null;          // game State
  let view = "start";
  let draft = {};        // in-progress form values for the current screen
  let flash = null;      // {kind, text}
  let report = null;     // result of the last time skip
  let confirmKey = null; // a destructive button waiting for its second tap
  let resetScroll = true;

  // ------------------------------------------------------------ utils
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const signed = (n) => (n >= 0 ? "+" : "") + fmtMoney(n);
  function short(n) { // compact money for the status strip
    const a = Math.abs(n), sign = n < 0 ? "-" : "";
    if (a >= 1e9) return `${sign}$${(a / 1e9).toFixed(1)}B`;
    if (a >= 1e6) return `${sign}$${(a / 1e6).toFixed(a >= 1e8 ? 0 : 1)}M`;
    if (a >= 1e3) return `${sign}$${(a / 1e3).toFixed(a >= 1e5 ? 0 : 1)}K`;
    return `${sign}$${Math.round(a)}`;
  }
  const colorName = (hex) => (D.CONSOLE_COLORS.find(([, h]) => h === hex) || D.CONSOLE_COLORS[0])[0];

  function storeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function storeSet(key, value) {
    try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
  }
  function autosave() { if (s) storeSet(SAVE_KEY, JSON.stringify(s)); }

  function attempt(fn, okText) {
    try {
      fn();
      if (okText) flash = { kind: "ok", text: okText };
      autosave();
      return true;
    } catch (e) {
      if (!(e instanceof GameError)) throw e;
      flash = { kind: "err", text: e.message };
      return false;
    }
  }

  function go(v, keep) {
    view = v;
    draft = keep || {};
    confirmKey = null;
    resetScroll = true;
    render();
  }

  // ------------------------------------------------------------ showroom (left)
  function lcd() {
    if (!s) return "";
    const owners = s.consoles.reduce((t, c) => t + c.installed_base, 0);
    const copies = s.games.reduce((t, g) => t + g.units_sold, 0);
    return `
    <header class="lcd">
      <div class="lcd-head">
        <button class="logo" data-act="go" data-arg="home" aria-label="Back to headquarters">${esc(s.company)}</button>
        <span class="date">${s.date}</span>
      </div>
      <div class="lcd-stats">
        <div class="stat"><b>${short(s.money)}</b><small>cash</small></div>
        <div class="stat"><b>${fmtNum(owners)}</b><small>consoles sold</small></div>
        <div class="stat"><b>${fmtNum(copies)}</b><small>games sold</small></div>
      </div>
    </header>`;
  }

  const newestConsole = () => (s && s.consoles.length ? s.consoles[s.consoles.length - 1] : null);

  function consoleModel(c) {
    return { svg: consoleSVG({ parts: c.parts, color: c.color, name: c.name }),
      title: c.name,
      caption: `${power(c)} power · ${appeal(c)} appeal · fits ${biggestSize(capacity(c))} games · ${colorName(c.color)}` };
  }
  function gameModel(g) {
    const plat = g.platform && s.consoles.find((c) => c.name === g.platform);
    const cart = !plat || capacity(plat) <= 2;
    const kind = [g.size, g.topic, g.genre].filter(Boolean).join(" ");
    return { svg: gameSVG(g, cart), title: g.title || "Untitled game",
      caption: `${kind || "Pick a size, genre and topic"}${g.score ? ` · score ${g.score.toFixed(1)}` : ""}`,
      focus: g.focus };
  }

  // What the showroom displays for the current screen.
  function showcase() {
    if (view === "design") {
      return consoleModel({ parts: draft.parts, color: draft.color, name: (draft.name || "").trim() || "Your console" });
    }
    if (view === "game" && draft.focus) return gameModel(draft);
    if (view === "games" && draft.show) {
      const g = s.games.find((x) => x.title === draft.show);
      if (g) return gameModel(g);
    }
    if (view === "consoles" && draft.show) {
      const c = s.consoles.find((x) => x.name === draft.show);
      if (c) return consoleModel(c);
    }
    if (!s) return consoleModel({ parts: Object.fromEntries(SLOTS.map((sl) => [sl, 0])), color: "#2c48c4", name: "Your console" });
    const c = newestConsole();
    if (c) return consoleModel(c);
    return null;
  }

  function modelHTML() {
    const m = showcase();
    if (!m) return `<div class="model empty-model"><p>Your first console will be shown here.</p></div>`;
    const bars = m.focus ? `<div class="focus-bars">${D.FOCUS_AREAS.map((a) =>
      `<span><i style="width:${m.focus[a] * 10}%"></i><small>${a}</small></span>`).join("")}</div>` : "";
    return `<div class="model">${m.svg}</div>
      <div class="caption"><b>${esc(m.title)}</b><small>${esc(m.caption)}</small>${bars}</div>`;
  }

  function stageControls() {
    if (!s) return `<div class="stage-title"><p class="eyebrow">A console-making game</p><h1 class="big-title">Console Tycoon</h1></div>`;
    if (view !== "home") return "";
    return `<div class="time">
        <div class="skip">
          <button class="btn dark" data-act="advance" data-arg="3">+3 mo</button>
          <button class="btn dark" data-act="advance" data-arg="6">+6 mo</button>
          <button class="btn dark" data-act="advance" data-arg="12">+1 yr</button>
        </div>
        <button class="btn primary next" data-act="advance" data-arg="1">Next month &rarr;</button>
      </div>`;
  }

  function refreshModel() {
    const el = document.getElementById("showroom");
    if (el) el.innerHTML = modelHTML();
  }

  // ------------------------------------------------------------ panel (right)
  function flashBox() {
    if (!flash) return "";
    const f = flash;
    flash = null;
    return `<div class="flash ${f.kind}" role="status">${esc(f.text)}</div>`;
  }

  function screen(title, body, backTo = "home") {
    return `<div class="screen-head"><button class="back" data-act="go" data-arg="${backTo}">&larr; ${backTo === "home" ? "HQ" : "Back"}</button><h1>${title}</h1></div>
      ${flashBox()}${body}`;
  }

  function newsLine(line) {
    const m = line.match(/^\[(\w+ \d+)\] (.*)$/);
    let text = m ? m[2] : line;
    let cls = "";
    if (/^ {2}- /.test(text)) { cls = "note"; text = text.trim().slice(2); }
    if (/released on|is in stores/.test(text)) cls = "big";
    return `<li class="${cls}"><time>${esc(m ? m[1] : "")}</time><span>${esc(text)}</span></li>`;
  }

  // Newest first, keeping critic notes under the headline they belong to.
  function latestNews(n) {
    const groups = [];
    for (const line of s.news.slice(-n - 6)) {
      if (/^\[[^\]]+\] {2}- /.test(line) && groups.length) groups[groups.length - 1].push(line);
      else groups.push([line]);
    }
    return groups.reverse().flat().slice(0, n);
  }

  const progress = (frac) => `<div class="bar"><i style="width:${Math.max(4, Math.min(100, frac * 100))}%"></i></div>`;

  function consoleRow(c, tappable) {
    const attrs = tappable ? `data-act="show" data-arg="${esc(c.name)}" role="button" tabindex="0"` : "";
    const swatch = `<span class="swatch-dot" style="background:${c.color}"></span>`;
    if (c.status === "dev") {
      const total = devMonths(c.parts);
      return `<div class="row ${tappable ? "tap" : ""} ${draft.show === c.name ? "on" : ""}" ${attrs}>${swatch}<div class="row-main"><b>${esc(c.name)}</b>
        <span class="sub">Being built · launches in ${c.dev_months_left} mo</span>${progress((total - c.dev_months_left) / total)}</div></div>`;
    }
    const state = c.status === "active" ? `$${c.price} · ${fmtNum(c.last_sales)} sold last month` : "Discontinued";
    return `<div class="row ${tappable ? "tap" : ""} ${draft.show === c.name ? "on" : ""}" ${attrs}>${swatch}<div class="row-main"><b>${esc(c.name)}</b>
      <span class="sub">${state} · ${fmtNum(c.installed_base)} owners</span></div></div>`;
  }

  function gameRow(g) {
    const total = D.GAME_SIZES[g.size].months;
    return `<div class="row"><div class="row-main"><b>${esc(g.title)}</b>
      <span class="sub">${g.size} ${g.topic} ${g.genre} for ${esc(g.platform)} · ${g.months_left} mo left</span>
      ${progress((total - g.months_left) / total)}</div></div>`;
  }

  const views = {};

  views.start = () => {
    let savedInfo = "";
    const saved = storeGet(SAVE_KEY);
    if (saved) {
      try { const st = State.fromDict(JSON.parse(saved)); savedInfo = `${esc(st.company)} · ${st.date}`; } catch (e) { savedInfo = ""; }
    }
    return `
      <p class="lede">You have a garage and ${fmtMoney(D.STARTING_MONEY)}. Design a games console, make games for it, and watch them sell.</p>
      ${flashBox()}
      ${savedInfo ? `<button class="btn primary wide" data-act="continue">Continue <span class="btn-sub">${savedInfo}</span></button>` : ""}
      <form class="card" data-form="new">
        <label for="company">Company name</label>
        <input id="company" maxlength="30" autocomplete="off" placeholder="Garage Games" value="${esc(draft.company || "")}" data-bind="company">
        <button class="btn ${savedInfo ? "" : "primary"} wide" type="submit">${savedInfo ? "Start a new company" : "Start your company"}</button>
        ${savedInfo ? `<p class="hint">Starting over replaces your saved game.</p>` : ""}
      </form>
      <div class="split">
        <button class="btn" data-act="go" data-arg="help">How to play</button>
        <button class="btn" data-act="go" data-arg="saves">Import a save</button>
      </div>`;
  };

  views.home = () => {
    const consoles = s.consoles.filter((c) => c.status !== "retired");
    const dev = s.gameInDev();
    const sellers = s.games.filter((g) => g.last_sales).sort((a, b) => b.last_sales - a.last_sales).slice(0, 3);
    const rep = report ? `<section class="card report">
        <div class="report-head"><h2>${report.months === 1 ? s.date : `${report.from} – ${s.date}`}</h2>
        <span class="delta ${report.delta < 0 ? "neg" : "pos"}">${signed(report.delta)}</span></div>
        ${report.lines.length ? `<ul class="news">${report.lines.map(newsLine).join("")}</ul>` : `<p class="hint">A quiet month.</p>`}
      </section>` : "";
    const hw = consoles.length ? consoles.map((c) => consoleRow(c, false)).join("") + (s.consoleInDev() ? "" : `<button class="btn" data-act="go" data-arg="design">Design another console</button>`)
      : `<div class="empty"><p>You don't have a console yet. Design one first; you can start a game for it while it's being built.</p>
         <button class="btn primary" data-act="go" data-arg="design">Design your first console</button></div>`;
    const sw = dev ? gameRow(dev) : s.consoles.length
      ? `<div class="empty"><p>Your studio is free.</p><button class="btn ${consoles.length ? "primary" : ""}" data-act="go" data-arg="game">Make a game</button></div>`
      : `<p class="hint">Design a console first, then make games for it.</p>`;
    const top = sellers.length ? `<section><h2>Best sellers last month</h2>${sellers.map((g) =>
      `<div class="row"><div class="row-main"><b>${esc(g.title)}</b><span class="sub">${esc(g.platform)} · score ${g.score.toFixed(1)}</span></div><span class="num">${fmtNum(g.last_sales)}</span></div>`).join("")}</section>` : "";
    const news = latestNews(8);
    return `${flashBox()}
      ${rep}
      <section><h2>Your consoles</h2>${hw}</section>
      <section><h2>Your studio</h2>${sw}</section>
      ${top}
      <nav class="grid" aria-label="Actions">
        <button class="tile" data-act="go" data-arg="consoles"><b>Consoles</b><small>${s.consoles.length} designed</small></button>
        <button class="tile" data-act="go" data-arg="games"><b>Games</b><small>${s.games.filter((g) => g.status === "released").length} released</small></button>
      </nav>
      ${news.length && !report ? `<section><h2>News</h2><ul class="news">${news.map(newsLine).join("")}</ul></section>` : ""}
      <button class="btn quiet" data-act="go" data-arg="saves">Save, load &amp; how to play</button>`;
  };

  // ---------- design a console
  views.design = () => {
    if (s.consoleInDev()) {
      return screen("Design a console", `<div class="empty"><p>Your hardware team is already building a console. Design the next one after it launches.</p></div>`);
    }
    const proto = { parts: draft.parts };
    const cost = devCost(draft.parts);
    const fair = fairPrice(proto);
    const price = draft.priceTouched ? draft.price : fair;
    const swatches = D.CONSOLE_COLORS.map(([name, hex]) =>
      `<button class="swatch ${draft.color === hex ? "on" : ""}" style="--sw:${hex}" data-act="color" data-arg="${hex}" aria-label="${name}" aria-pressed="${draft.color === hex}"></button>`).join("");
    const slots = SLOTS.map((slot) => {
      const kind = D.POWER_SLOTS.includes(slot) ? "power" : "appeal";
      const opts = D.COMPONENTS[slot].map((t, i) => {
        const locked = i > s.unlocked[slot];
        return `
        <button class="opt ${draft.parts[slot] === i ? "on" : ""} ${locked ? "locked" : ""}" data-act="part" data-arg="${slot}:${i}" aria-pressed="${draft.parts[slot] === i}" ${locked ? "disabled" : ""}>
          <b>${t.name}</b><small>+${t.rating} ${kind}${t.capacity ? ` · fits ${biggestSize(t.capacity)} games` : ""}</small>
          <span class="num">${locked ? "Locked" : `$${t.unit_cost}`}</span></button>`;
      }).join("");
      return `<fieldset><legend>${slot}</legend>${opts}</fieldset>`;
    }).join("");
    const afford = cost <= s.money;
    return screen("Design a console", `
      <section class="card">
        <label for="cname">Console name</label>
        <input id="cname" maxlength="16" autocomplete="off" placeholder="e.g. Gizmo 64" value="${esc(draft.name || "")}" data-bind="name">
        <label>Colour <span class="label-note">${colorName(draft.color)}</span></label>
        <div class="swatches">${swatches}</div>
      </section>
      <p class="hint">CPU, GPU and memory add power, which makes games look better. Storage, controller and case add appeal. For now only the earliest parts are available.</p>
      ${slots}
      <section class="card spec">
        <h2>Spec sheet</h2>
        <dl>
          <dt>Power</dt><dd>${power(proto)} / 21</dd>
          <dt>Appeal</dt><dd>${appeal(proto)} / 21</dd>
          <dt>Largest game</dt><dd>${biggestSize(capacity(proto))}</dd>
          <dt>Cost per unit</dt><dd>$${unitCost(proto)}</dd>
          <dt>Development</dt><dd>${fmtMoney(cost)} · ${devMonths(draft.parts)} months</dd>
          <dt>Fair price</dt><dd>about $${fair} <small>(you keep ${Math.round(RETAIL_SHARE * 100)}%, ~$${Math.round(fair * RETAIL_SHARE - unitCost(proto))} profit each)</small></dd>
        </dl>
        <label for="cprice">Price ($)</label>
        <input id="cprice" type="number" inputmode="numeric" min="1" value="${price}" data-bind="price">
        <button class="btn primary wide" data-act="build" ${afford ? "" : "disabled"}>${afford ? `Build it for ${fmtMoney(cost)}` : `Need ${fmtMoney(cost)}`}</button>
      </section>`);
  };

  // ---------- make a game
  function gameReady() {
    const d = draft;
    const used = D.FOCUS_AREAS.reduce((t, a) => t + d.focus[a], 0);
    return Boolean(d.platform && d.size && d.genre && d.topic && used === D.FOCUS_POINTS && (d.title || "").trim());
  }

  views.game = () => {
    const d = draft;
    const plats = s.platforms();
    if (!plats.length) return screen("Make a game", `<div class="empty"><p>Design a console first, then make games for it.</p><button class="btn primary" data-act="go" data-arg="design">Design a console</button></div>`);
    if (s.gameInDev()) return screen("Make a game", `<div class="empty"><p>Your studio is busy with ${esc(s.gameInDev().title)}. Start the next game when it ships.</p></div>`);
    const plat = d.platform ? s.console(d.platform) : null;
    if (d.size && plat && D.GAME_SIZES[d.size].capacity > capacity(plat)) d.size = null;

    const platOpts = plats.map((c) => `
      <button class="opt ${d.platform === c.name ? "on" : ""}" data-act="pick" data-arg="platform:${esc(c.name)}">
        <b>${esc(c.name)}</b><small>${c.status === "dev" ? "Being built" : `${fmtNum(c.installed_base)} owners`} · ${power(c)} power · up to ${biggestSize(capacity(c))}</small></button>`).join("");

    const sizeOpts = SIZE_NAMES.map((name) => {
      const sp = D.GAME_SIZES[name];
      const why = [];
      if (plat && sp.capacity > capacity(plat)) why.push("won't fit");
      if (sp.cost > s.money) why.push("too expensive");
      return `<button class="opt ${d.size === name ? "on" : ""}" data-act="pick" data-arg="size:${name}" ${why.length ? "disabled" : ""}>
        <b>${name}</b><small>${sp.months} months · sells at $${sp.price}${why.length ? ` · ${why.join(", ")}` : ""}</small>
        <span class="num">${fmtMoney(sp.cost)}</span></button>`;
    }).join("");

    const chips = (key, list) => `<div class="chips">${list.map((x) =>
      `<button class="chip ${d[key] === x ? "on" : ""}" data-act="pick" data-arg="${key}:${x}" aria-pressed="${d[key] === x}">${x}</button>`).join("")}</div>`;

    const left = D.FOCUS_POINTS - D.FOCUS_AREAS.reduce((t, a) => t + d.focus[a], 0);
    const focus = D.FOCUS_AREAS.map((a) => `
      <div class="stepper">
        <span>${a}</span>
        <button class="step" data-act="focus" data-arg="${a}:-1" aria-label="Less ${a}" ${d.focus[a] <= 0 ? "disabled" : ""}>&minus;</button>
        <output>${d.focus[a]}</output>
        <button class="step" data-act="focus" data-arg="${a}:1" aria-label="More ${a}" ${left <= 0 ? "disabled" : ""}>+</button>
        <span class="pips">${"■".repeat(d.focus[a])}</span>
      </div>`).join("");

    let lessons = "";
    if (d.genre || d.topic) {
      const past = s.games.filter((g) => g.status === "released" && (g.genre === d.genre || g.topic === d.topic))
        .sort((a, b) => b.release_month - a.release_month).slice(0, 3);
      if (past.length) {
        lessons = `<div class="lessons"><h3>Your notes</h3>${past.map((g) => `<p><b>${esc(g.title)}</b> (${g.topic} ${g.genre}, ${D.FOCUS_AREAS.map((a) => g.focus[a]).join("/")}) scored ${g.score.toFixed(1)}. ${g.feedback.map(esc).join(" ")}</p>`).join("")}</div>`;
      }
    }

    const ready = gameReady();
    return screen("Make a game", `
      <section class="card">
        <label for="gtitle">Title</label>
        <input id="gtitle" maxlength="30" autocomplete="off" placeholder="e.g. Neon Ninja" value="${esc(d.title || "")}" data-bind="title">
      </section>
      <fieldset><legend>Console</legend>${platOpts}</fieldset>
      <fieldset><legend>Size</legend>${sizeOpts}</fieldset>
      <fieldset><legend>Genre</legend>${chips("genre", Object.keys(D.GENRES).sort())}</fieldset>
      <fieldset><legend>Topic</legend>${chips("topic", Object.keys(D.TOPICS).sort())}</fieldset>
      <fieldset><legend>Focus <span class="legend-note">${left === 0 ? "all 10 points used" : `${left} point${left === 1 ? "" : "s"} left`}</span></legend>
        <p class="hint">Each genre has a hidden ideal split. Reviews tell you how close you got. Graphics look better on powerful consoles.</p>
        ${focus}
        ${lessons}
      </fieldset>
      <section class="card">
        <button class="btn primary wide" data-act="startgame" ${ready ? "" : "disabled"}>Start development</button>
        <p class="hint" id="gamehint" ${ready ? "hidden" : ""}>Give it a title, pick a console, size, genre and topic, and use all 10 focus points.</p>
      </section>`);
  };

  // ---------- consoles
  views.consoles = () => {
    if (!s.consoles.length) return screen("Consoles", `<div class="empty"><p>You haven't designed a console yet.</p><button class="btn primary" data-act="go" data-arg="design">Design a console</button></div>`);
    const cards = s.consoles.slice().reverse().map((c) => {
      const parts = SLOTS.map((sl) => part(c, sl).name).join(" · ");
      const head = `${consoleRow(c, true)}<p class="hint">${parts}</p>`;
      if (c.status === "dev") return `<section class="card">${head}</section>`;
      const own = s.games.filter((g) => g.platform === c.name && g.status === "released").length;
      const key = `retire:${c.name}`;
      return `<section class="card">
        ${head}
        <dl>
          <dt>Cost per unit</dt><dd>$${unitCost(c)} · fair price $${fairPrice(c)}</dd>
          <dt>Revenue</dt><dd>${fmtMoney(c.revenue)}</dd>
          <dt>Profit</dt><dd class="${c.profit < 0 ? "neg" : ""}">${fmtMoney(c.profit)}</dd>
          <dt>Games</dt><dd>${own}</dd>
        </dl>
        ${c.status === "active" ? `
        <div class="inline">
          <label for="p-${esc(c.name)}" class="sr">Price</label>
          <input id="p-${esc(c.name)}" type="number" inputmode="numeric" min="1" value="${c.price}" data-price-for="${esc(c.name)}">
          <button class="btn" data-act="setprice" data-arg="${esc(c.name)}">Set price</button>
        </div>
        <button class="btn danger" data-act="retire" data-arg="${esc(c.name)}">${confirmKey === key ? "Tap again to discontinue" : "Discontinue"}</button>` : ""}
      </section>`;
    }).join("");
    return screen("Consoles", `<p class="hint">Tap a console to show it in the showroom.</p>` +
      (s.consoleInDev() ? "" : `<button class="btn primary wide" data-act="go" data-arg="design">Design a new console</button>`) + cards);
  };

  // ---------- games
  views.games = () => {
    const newBtn = s.consoles.length && !s.gameInDev() ? `<button class="btn primary wide" data-act="go" data-arg="game">Make a new game</button>` : "";
    if (!s.games.length) return screen("Games", newBtn || `<div class="empty"><p>Design a console first, then make games for it.</p></div>`);
    const dev = s.gameInDev();
    const released = s.games.filter((g) => g.status === "released").sort((a, b) => b.release_month - a.release_month);
    return screen("Games", `<p class="hint">Tap a game to show its box and reviews.</p>` + newBtn + (dev ? gameRow(dev) : "") + released.map((g) => {
      const cls = g.score >= 8 ? "good" : g.score >= 6 ? "mid" : "bad";
      const open = draft.show === g.title;
      return `<div class="row game ${open ? "on" : ""}">
        <button class="game-head" data-act="show" data-arg="${esc(g.title)}" aria-expanded="${open}"><div class="row-main"><b>${esc(g.title)}</b><span class="sub">${g.size} ${g.topic} ${g.genre} · ${esc(g.platform)} · ${fmtNum(g.units_sold)} sold</span></div>
        <span class="score ${cls}">${g.score.toFixed(1)}</span></button>
        ${open ? `<div class="detail">
          <p>Reviews ${g.reviews.join(" / ")} · Revenue ${fmtMoney(g.revenue)}</p>
          <p>Focus: ${D.FOCUS_AREAS.map((a) => `${a} ${g.focus[a]}`).join(", ")}</p>
          <ul>${g.feedback.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
        </div>` : ""}
      </div>`;
    }).join(""));
  };

  // ---------- saves & help
  const HELP = `
    <ul class="rules">
      <li><b>Design a console</b> from six parts and paint it. CPU, GPU and memory add power; storage, controller and case add appeal. Storage also limits how big a game fits. Only the earliest parts are unlocked for now.</li>
      <li><b>Price it</b> near what buyers think is fair. Cheaper sells more units, but you make less on each one.</li>
      <li><b>Make games</b> for your consoles. You can start one while the console is being built; it ships at launch.</li>
      <li><b>Split 10 focus points</b> between Gameplay, Graphics, Story and Audio. Each genre has a hidden ideal split, and some topics suit some genres. The critics' notes tell you what to change.</li>
      <li><b>Good games sell consoles</b>, and more console owners means more game sales.</li>
      <li><b>Console sales fade</b> over time. Design a new one to keep growing.</li>
    </ul>`;

  views.help = () => screen("How to play", HELP, s ? "home" : "start");

  views.saves = () => {
    const body = `
      ${s ? `<section class="card">
        <h2>Export save</h2>
        <p class="hint">The game saves itself on this device after every move. Copy this code to move your game to another device.</p>
        <textarea id="exporttext" readonly rows="4">${esc(JSON.stringify(s))}</textarea>
        <button class="btn wide" data-act="copy">Copy save code</button>
      </section>` : ""}
      <section class="card">
        <h2>Import save</h2>
        <p class="hint">Paste a save code from another device.</p>
        <textarea id="importtext" rows="4" placeholder='{"version": 2, ...}' data-bind="importText">${esc(draft.importText || "")}</textarea>
        <button class="btn wide" data-act="import">Load this save</button>
      </section>
      ${s ? `<section class="card"><h2>Start over</h2><p class="hint">Ends this company and deletes its save on this device.</p>
        <button class="btn danger wide" data-act="restart">${confirmKey === "restart" ? "Tap again to delete and start over" : "Start a new company"}</button></section>
        <section><h2>How to play</h2>${HELP}</section>` : ""}`;
    return screen(s ? "Save &amp; help" : "Import a save", body, s ? "home" : "start");
  };

  // ------------------------------------------------------------ actions
  function nextDate(dateStr) {
    const [m, y] = dateStr.split(" ");
    const i = (D.MONTH_NAMES.indexOf(m) + 1) % 12;
    return `${D.MONTH_NAMES[i]} ${Number(y) + (i === 0 ? 1 : 0)}`;
  }

  const actions = {
    go: (v) => {
      if (v === "design") return go(v, { parts: Object.fromEntries(SLOTS.map((sl) => [sl, 0])), color: D.CONSOLE_COLORS[0][1] });
      if (v === "game") {
        const plats = s.platforms();
        const newest = plats[plats.length - 1];
        return go(v, { focus: { Gameplay: 4, Graphics: 2, Story: 2, Audio: 2 }, platform: newest ? newest.name : null });
      }
      return go(v);
    },
    continue: () => {
      try { s = State.fromDict(JSON.parse(storeGet(SAVE_KEY))); } catch (e) { flash = { kind: "err", text: "That save couldn't be read." }; return render(); }
      report = null;
      go("home");
    },
    advance: (n) => {
      const from = nextDate(s.date);
      let lines = [], delta = 0;
      for (let i = 0; i < Number(n); i++) {
        const r = s.advance();
        lines = lines.concat(r.lines);
        delta += r.delta;
      }
      report = { months: Number(n), from, delta, lines };
      autosave();
      go("home");
    },
    part: (arg) => {
      const [slot, i] = arg.split(":");
      draft.parts[slot] = Number(i);
      render();
    },
    color: (hex) => { draft.color = hex; render(); },
    build: () => {
      const proto = { parts: draft.parts };
      const price = draft.priceTouched ? Number(draft.price) : fairPrice(proto);
      const name = (draft.name || "").trim();
      if (attempt(() => s.designConsole(name, draft.parts, price, draft.color), `Engineers are building the ${name}. It launches in ${devMonths(draft.parts)} months.`)) go("home");
      else render();
    },
    pick: (arg) => {
      const i = arg.indexOf(":");
      draft[arg.slice(0, i)] = arg.slice(i + 1);
      render();
    },
    focus: (arg) => {
      const [area, delta] = arg.split(":");
      const used = D.FOCUS_AREAS.reduce((t, a) => t + draft.focus[a], 0);
      const v = draft.focus[area] + Number(delta);
      if (v >= 0 && used + Number(delta) <= D.FOCUS_POINTS) draft.focus[area] = v;
      render();
    },
    startgame: () => {
      const d = draft;
      if (attempt(() => s.startGame(d.title, d.genre, d.topic, d.size, d.platform, d.focus), `Development started on ${d.title.trim()}.`)) go("home");
      else render();
    },
    show: (name) => { draft.show = draft.show === name && view === "games" ? null : name; render(); },
    setprice: (name) => {
      const input = document.querySelector(`[data-price-for="${CSS.escape(name)}"]`);
      const price = Number(input.value);
      attempt(() => s.setPrice(name, price), `The ${name} now sells for $${Math.round(price)}.`);
      render();
    },
    retire: (name) => {
      const key = `retire:${name}`;
      if (confirmKey !== key) { confirmKey = key; return render(); }
      confirmKey = null;
      attempt(() => s.discontinue(name), `${name} discontinued.`);
      render();
    },
    copy: () => {
      const box = document.getElementById("exporttext");
      const fallback = () => { box.focus(); box.select(); flash = { kind: "ok", text: "Selected. Use your phone's Copy." }; render(); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(box.value).then(() => { flash = { kind: "ok", text: "Save code copied." }; render(); }, fallback);
      } else fallback();
    },
    import: () => {
      try {
        s = State.fromDict(JSON.parse(draft.importText || ""));
      } catch (e) {
        flash = { kind: "err", text: e instanceof GameError ? e.message : "That doesn't look like a save code. Paste the whole code, including the { and }." };
        return render();
      }
      report = null;
      autosave();
      flash = { kind: "ok", text: `Loaded ${s.company}.` };
      go("home");
    },
    restart: () => {
      if (confirmKey !== "restart") { confirmKey = "restart"; return render(); }
      s = null;
      report = null;
      storeSet(SAVE_KEY, null);
      go("start");
    },
    upright: () => { storeSet(UPRIGHT_KEY, "1"); document.documentElement.classList.add("upright"); },
  };

  // ------------------------------------------------------------ wiring
  function render() {
    const old = app.querySelector(".panel");
    const keep = old && !resetScroll ? old.scrollTop : 0;
    app.innerHTML = `
      <div class="layout">
        <aside class="stage" aria-label="Showroom">
          ${lcd()}
          <div class="showroom" id="showroom">${modelHTML()}</div>
          ${stageControls()}
        </aside>
        <main class="panel">${(views[view] || views.start)()}</main>
      </div>
      <div class="rotate" role="dialog" aria-label="Turn your phone sideways">
        <svg viewBox="0 0 120 120" aria-hidden="true"><rect x="38" y="18" width="44" height="78" rx="8" fill="none" stroke="currentColor" stroke-width="5"/>
          <path d="M 24 70 a 40 40 0 0 1 20 -48" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M 36 14 l 9 8 l -10 6" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h1>Turn your phone sideways</h1>
        <p>Console Tycoon is made for landscape: the showroom on the left, your workbench on the right.</p>
        <button class="btn" data-act="upright">Play upright instead</button>
      </div>`;
    const panel = app.querySelector(".panel");
    if (panel) panel.scrollTop = keep;
    resetScroll = false;
  }

  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el || el.disabled) return;
    e.preventDefault();
    const act = actions[el.dataset.act];
    if (act) act(el.dataset.arg);
  });

  app.addEventListener("input", (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.bind) return;
    draft[el.dataset.bind] = el.value;
    if (el.dataset.bind === "price") draft.priceTouched = true;
    // Update the model live without re-rendering the form, so the keyboard stays open.
    if ((view === "design" && el.dataset.bind === "name") || (view === "game" && el.dataset.bind === "title")) refreshModel();
    if (view === "game" && el.dataset.bind === "title") {
      const ok = gameReady();
      const btn = app.querySelector('[data-act="startgame"]');
      const hint = document.getElementById("gamehint");
      if (btn) btn.disabled = !ok;
      if (hint) hint.hidden = ok;
    }
  });

  app.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.dataset.form === "new") {
      s = createGame((draft.company || "").trim() || "Garage Games");
      report = null;
      autosave();
      go("home");
    }
  });

  if (storeGet(UPRIGHT_KEY)) document.documentElement.classList.add("upright");

  // Keep the game across live updates of the page.
  function start(data) {
    if (data && data.save) {
      try { s = State.fromDict(data.save); view = data.view || "home"; draft = data.draft || {}; } catch (e) { s = null; }
    }
    if (!s) { view = view === "help" || view === "saves" ? view : "start"; }
    if (view === "design" && !draft.parts) view = "home";
    if (view === "game" && !draft.focus) view = "home";
    render();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ save: s ? s.toDict() : null, view, draft }));
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();

</script>

</body>
</html>
